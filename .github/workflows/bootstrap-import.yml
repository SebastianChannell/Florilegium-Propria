name: Complete project import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'SebastianChannell/Florilegium-Propria'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/Florilegium-Propria.zip"
          cat .bootstrap/part-* > "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "8d437d454c2bce4c8e9b5cc55416379190c4fff1c40fde3a4354556ac0719901"
          unzip -oq "$archive" -d "${GITHUB_WORKSPACE}"
          rm -rf .bootstrap
          rm -f .github/workflows/sync-propers.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build daily 1962 Mass propers reader"
          git push origin HEAD:main
