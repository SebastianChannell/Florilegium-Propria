name: Generate Divino Afflatu PR data

on:
  push:
    branches:
      - agent/add-1954-rubrics
    paths-ignore:
      - "public/data/mass/**"

permissions:
  contents: write

concurrency:
  group: generate-1954-pr-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Divinum Officium Perl requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcgi-pm-perl liburi-perl libhtml-parser-perl

      - name: Check out the matching Divinum Officium source
        run: |
          git clone --no-checkout https://github.com/DivinumOfficium/divinum-officium.git "$RUNNER_TEMP/divinum-officium"
          git -C "$RUNNER_TEMP/divinum-officium" checkout --detach 75cbb135301ff479474904f104970ec4d6906cb4

      - name: Generate and verify both requested years
        run: |
          node scripts/generate-propers.mjs --year 2026 --source "$RUNNER_TEMP/divinum-officium" --rubrics 1954
          node scripts/generate-propers.mjs --year 2027 --source "$RUNNER_TEMP/divinum-officium" --rubrics 1954
          node scripts/compare-rubrics.mjs
          node scripts/build.mjs
          node --test

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/mass
          git commit -m "Generate Divino Afflatu 1954 propers"
          git push
