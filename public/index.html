<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070606">
    <meta name="color-scheme" content="dark">
    <meta
      name="description"
      content="The daily Mass propers of the 1962 Roman Missal in parallel Latin and English."
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Propria — Sacrum Florilegium</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=2">
    <script type="module" src="./app.js?v=2"></script>
  </head>
  <body>
    <a class="skip-link" href="#mass-content">Skip to the propers</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Propria home">
          <span>Sacrum Florilegium</span>
          <strong>Propria</strong>
        </a>
        <p class="subtitle">Missa diéi · Rubricæ MCMLX</p>
      </header>

      <main>
        <nav class="day-navigation" aria-label="Choose Mass date">
          <button id="previous-day" class="day-step" type="button" aria-label="Previous day">
            <span aria-hidden="true">←</span>
          </button>

          <label class="date-control" for="date-input">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
              <rect x="4" y="5" width="16" height="15" rx="2"></rect>
              <path d="M8 3v4M16 3v4M4 10h16"></path>
            </svg>
            <span>Change day</span>
            <input id="date-input" type="date" autocomplete="off">
          </label>

          <button id="next-day" class="day-step" type="button" aria-label="Next day">
            <span aria-hidden="true">→</span>
          </button>
        </nav>

        <article id="mass-content" class="mass" aria-labelledby="mass-title" aria-busy="true">
          <header class="mass-header">
            <p class="edition">Missale Romanum · 1962</p>
            <time id="mass-date" class="mass-date"></time>
            <h1 id="mass-title" tabindex="-1">Loading the Mass…</h1>
            <p id="mass-rank" class="mass-rank" hidden></p>
            <p id="mass-note" class="mass-note" hidden></p>
          </header>

          <div class="view-control">
            <div>
              <span class="view-kicker">Showing</span>
              <strong id="view-label">Lectio · Evangelium</strong>
            </div>
            <button id="view-toggle" type="button" aria-pressed="false">Show all propers</button>
          </div>

          <div id="language-row" class="language-row" aria-hidden="true">
            <span lang="la">Latine</span>
            <span lang="en">English</span>
          </div>

          <div id="propers" class="propers"></div>

          <div id="status-message" class="status-message" role="status" aria-live="polite">
            Resolving today’s Mass…
          </div>
        </article>
      </main>

      <footer class="site-footer">
        <span aria-hidden="true">✠</span>
        <span>T.A.D.M.N.</span>
      </footer>
    </div>

    <noscript>
      <p class="noscript">JavaScript is required to select and display the daily propers.</p>
    </noscript>
  </body>
</html>
